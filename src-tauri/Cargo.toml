[package]
name = "from-zero-to-gpt"
version = "0.4.1"
description = "本地优先的交互式 GPT 学习实验室"
authors = ["From Zero to GPT contributors"]
license = "GPL-2.0-only"
repository = "https://github.com/Thweki/from-zero-to-gpt"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
atomicwrites = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["macros"] }
tokio-util = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8.1"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"
windows-version = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4.2"

[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["android-native-keyring-store"] }
jni = "0.21.1"
ndk-context = "0.1.1"
